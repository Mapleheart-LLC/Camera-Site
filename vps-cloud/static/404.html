<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 - Wrong Damn Yard | mochii.live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 18%, rgba(232, 174, 183, 0.18) 0%, rgba(232, 174, 183, 0) 38%),
        radial-gradient(circle at 82% 82%, rgba(29, 185, 84, 0.14) 0%, rgba(29, 185, 84, 0) 42%),
        linear-gradient(145deg, #100f16 0%, #191725 55%, #1f1320 100%);
      color: #f5e9ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(30, 28, 42, 0.92);
      border: 1px solid #e8aeb7;
      border-radius: 20px;
      padding: 2.6rem 2rem 2.1rem;
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.56);
      text-align: center;
    }

    .paw {
      font-size: 3rem;
      margin-bottom: .9rem;
      display: block;
      transform-origin: 50% 90%;
      animation: paw-wiggle 2.3s ease-in-out infinite;
    }

    @keyframes paw-wiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-9deg) scale(1.02); }
      40% { transform: rotate(8deg) scale(1.02); }
      60% { transform: rotate(-6deg) scale(1.01); }
      80% { transform: rotate(6deg) scale(1.01); }
    }

    .error-code {
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: #cda9b6;
      margin-bottom: .55rem;
    }

    h1 {
      font-size: 1.52rem;
      font-weight: 800;
      color: #ffd7e3;
      margin-bottom: .78rem;
    }

    p {
      font-size: .93rem;
      color: #d7bbc5;
      line-height: 1.58;
      margin-bottom: 1.8rem;
    }

    a.btn {
      display: inline-block;
      padding: .68rem 1.45rem;
      background: #311926;
      border: 1px solid #e8aeb7;
      border-radius: 10px;
      color: #ffd7e3;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 800;
      text-decoration: none;
      transition: background .15s, color .15s;
    }

    a.btn:hover { background: #e8aeb7; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="card" role="main">
    <span class="paw" aria-hidden="true">🐾</span>
    <p class="error-code">404 - Wrong Damn Yard</p>
    <h1>Yeah, this leash goes nowhere.</h1>
    <p>That route slipped the leash, moved, or never existed.<br>Head back and pick a page that actually behaves.</p>
    <a class="btn" href="https://mochii.live">Drag Me Back Home</a>
  </div>
</body>
</html>
